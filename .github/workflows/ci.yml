name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ============================================================
  # Python API Tests
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          DB_PASSWORD: "ci-test-db-password"
          ADMIN_API_KEY: "ci-test-admin-api-key"
        run: pytest tests/ -v

  # ============================================================
  # Node.js Notification Service Tests
  # ============================================================
  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  # ============================================================
  # SAST — Static Application Security Testing (Bandit)
  # Scans Python source for insecure coding patterns and injection risks.
  # Fails the build on any HIGH or CRITICAL severity finding.
  # ============================================================
  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit SAST scan
        run: |
          # Generate full JSON report (--exit-zero so it never blocks the report step)
          bandit -r app/ \
            --format json \
            --output reports/sast.bandit.json \
            --severity-level medium \
            --exit-zero
          # Fail CI if any HIGH or CRITICAL findings exist
          bandit -r app/ \
            --severity-level high \
            --quiet

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: reports/sast.bandit.json

  # ============================================================
  # SCA — Software Composition Analysis (pip-audit)
  # Scans pinned Python dependencies for known CVEs.
  # Fails the build on HIGH or CRITICAL CVEs.
  # ============================================================
  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit SCA scan
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output reports/sca.pip-audit.json \
            || true

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: reports/sca.pip-audit.json

  # ============================================================
  # Container Image Scan (Trivy)
  # Builds the Docker image and scans for OS/library CVEs
  # and Dockerfile misconfigurations.
  # Fails on CRITICAL severity vulnerabilities.
  # ============================================================
  container-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vulntracker-api:ci .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.76.0

      - name: Run Trivy container image scan
        run: |
          trivy image \
            --format json \
            --output reports/container.trivy.json \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            vulntracker-api:ci

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: reports/container.trivy.json

  # ============================================================
  # IaC Security Scan (Trivy)
  # Scans the Terraform configuration for misconfigurations,
  # insecure defaults, and policy violations.
  # ============================================================
  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.76.0

      - name: Run Trivy IaC scan on Terraform
        run: |
          trivy config \
            --format json \
            --output reports/iac.trivy.json \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            terraform/

      - name: Upload IaC scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-scan-report
          path: reports/iac.trivy.json